[view.epoch_boundaries]
description = "The (epoch, L2 block) window each epoch occupies, derived from l1_blocks with EpochManager's own arithmetic: within each EpochLengthUpdate segment, epoch(l1) = e0 + (l1 - anchor) // len, where the first update anchors at its own L1 block and each later one at the start of the epoch it fired in. On Arbitrum One that is epoch 1 at L1 16083151 with length 6646, then epoch 92 at L1 16687937 with length 7200. start_block is the first L2 block this nest holds in the epoch, not the chain's first L2 block of it, because only log-bearing blocks carry an L1 number here; bucketing by it is still exact, since L1 numbers never decrease along L2. start_l1_block and end_l1_block are the exact L1 range, start_l1_block equal to the network subgraph's startBlock and end_l1_block one less than its endBlock (the subgraph's endBlock is the next epoch's start). A length change applies from the start of the epoch it fired in, so end_l1_block is start_l1_block plus that epoch's length, less one. start_block/end_block are the approximate L2 range: the first block this nest holds in the epoch, and the block before the next epoch's first. unobserved_gap_blocks is the L2 window before start_block where the chain's own first block of the epoch lies; no row of the nest is in it. boundary_source is 'l1' on every row. Computing the boundary in L2 block space is wrong by a factor of ~48. See nightswatchhq/nuthatch#1116 and #1882."

[view.lodestar_delegations]
description = "Delegation, undelegation and withdrawal events across Horizon staking and the pre-Horizon topics on the same proxy. The shape Lodestar's delegations cron and /api/delegation-events read. tokens is wei."

[view.lodestar_epochs]
description = "Per-epoch rewards, query fees and signal in Lodestar's SubgraphEpoch shape. Three of the value columns are defined to match the Graph Network subgraph's fields exactly rather than the raw event sums, and the difference is not cosmetic: signalled_tokens is gross signal MINUS curationTax and does NOT subtract burns (subtracting burns produced negative values in 81 of 266 epochs); query_fees_collected is tokensCollected minus tokensCurators minus a 1% protocol tax truncated PER EVENT, not on the epoch total. Every row of the nest is placed in the epoch its block's L1 number says, by EpochManager's own arithmetic (see epoch_boundaries), for every epoch since the contract's first. Every epoch except the newest is immutable at a pinned block. start_block is the first L2 block this nest holds in the epoch and end_block the block before the next epoch's start_block, so they are approximate and not comparable with the subgraph; start_l1_block and end_l1_block are the exact L1 range (see epoch_boundaries). All amounts are wei."

[view.lodestar_network_params]
description = "One row: the governance parameters sampled by the pinned calls, EpochManager's length state, and the all-time curation and protocol taxes. last_length_update_block is the contract's lastLengthUpdateBlock(), an L1 block (16687937 on Arbitrum One, the start of epoch 92, where the length last changed); last_length_update_l2_block is the L2 block the EpochLengthUpdate event is in."

[view.lodestar_indexer_daily]
description = "lodestar_indexer_deployment_daily summed over deployments: one row per indexer per UTC day, the same columns and the same definitions. checks/indexer-daily-sums.sql holds both against the raw events."

[view.lodestar_indexer_deployment_daily]
description = "One row per indexer, deployment (bytes32 hex) and UTC day (day_start, unix seconds at midnight): what was paid and what the indexer kept. Dated by the event that paid it, NOT by allocation close: Horizon collects rewards on every POI, so a close-dated series moves weeks of rewards onto one day. Rewards: IndexingRewardsCollected, legacy RewardsAssigned, and HorizonRewardsAssigned on legacy allocations only (on a Horizon allocation it duplicates IndexingRewardsCollected in the same tx). total_rewards = indexer_rewards + delegator_rewards. Query fees: fees_gross = fees_protocol + fees_curators + fees_delegators + fees_burned + fees_net. Horizon follows GraphPayments.collect exactly: protocol cut rounded up, then curators, then the delegation fee cut (payment type 0) when the pool has shares, each rounded up; fees_net is tokensReceiver, checked against GraphPaymentCollected receipts. Legacy rebates: fees_net is queryRebates, fees_burned what the exponential rebate withheld. AllocationCollected rows have NULL fees_delegators and fees_net, because that era paid at a later claim. fees_protocol and fees_net are NULL when no protocol_payment_cut sample exists. All amounts are wei."
